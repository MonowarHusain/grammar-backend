<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neutral Grammar & Paraphrase Engine</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 32px 16px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #fff;
    }
    p.subtitle {
      color: var(--muted);
      font-size: 0.95rem;
      margin-top: -12px;
    }
    textarea {
      width: 100%;
      height: 160px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      color: var(--text);
      font-size: 1rem;
      resize: vertical;
      outline: none;
    }
    textarea:focus {
      border-color: var(--accent);
    }
    .actions {
      display: flex;
      gap: 12px;
    }
    button {
      padding: 12px 24px;
      background: var(--accent);
      color: #000;
      font-weight: 600;
      font-size: 0.95rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }
    .card-header {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 8px;
      font-weight: 600;
    }
    .output-text {
      font-size: 1rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .meta {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 10px;
    }
  </style>
</head>
<body>

<div class="container">
  <div>
    <h1>Grammar & Style Fixer</h1>
    <p class="subtitle">Zero content filtering, zero censorship.</p>
  </div>

  <textarea id="inputText" placeholder="Paste your text here (any format, context, or explicit language)..."></textarea>
  
  <div class="actions">
    <button id="submitBtn" onclick="submitText()">Fix Grammar</button>
  </div>

  <div class="card">
    <div class="card-header">Corrected Output</div>
    <div id="outputText" class="output-text">Your corrected text will appear here.</div>
    <div id="statusMeta" class="meta"></div>
  </div>
</div>

<script>
  const BACKEND_URL = "https://grammar-backend-yd89.onrender.com";

  async function submitText() {
    const inputEl = document.getElementById("inputText");
    const outputEl = document.getElementById("outputText");
    const metaEl = document.getElementById("statusMeta");
    const btn = document.getElementById("submitBtn");

    const text = inputEl.value.trim();
    if (!text) return;

    btn.disabled = true;
    outputEl.innerText = "Analyzing text (if idle, free server takes ~30-45s to wake up)...";
    metaEl.innerText = "";

    try {
      const response = await fetch(`${BACKEND_URL}/fix`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: text })
      });

      if (!response.ok) {
        throw new Error(`Server returned status: ${response.status}`);
      }

      const data = await response.json();
      outputEl.innerText = data.corrected;
      metaEl.innerText = `Session ID: ${data.session_id} (Cached temporarily in RAM)`;
    } catch (err) {
      outputEl.innerText = "Error contacting backend. Please wait a moment if it is spinning up and try again.";
      metaEl.innerText = err.message;
    } finally {
      btn.disabled = false;
    }
  }
</script>

</body>
</html>
