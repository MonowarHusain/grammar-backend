<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neutral AI Grammar & Paraphraser</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151d30;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: #243049;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 36px 16px; min-height: 100vh; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 820px; display: flex; flex-direction: column; gap: 20px; }
    h1 { font-size: 1.75rem; font-weight: 700; color: #fff; }
    p.subtitle { color: var(--muted); font-size: 0.95rem; margin-top: -12px; }
    textarea {
      width: 100%; height: 160px; background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 14px; color: var(--text); font-size: 1rem; resize: vertical; outline: none;
    }
    textarea:focus { border-color: var(--accent); }
    .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
    .mode-group { display: flex; gap: 8px; }
    .mode-btn {
      padding: 8px 16px; background: var(--card-bg); color: var(--muted); border: 1px solid var(--border);
      border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-weight: 500;
    }
    .mode-btn.active { background: var(--accent); color: #000; font-weight: 600; border-color: var(--accent); }
    .action-btn {
      padding: 10px 22px; background: var(--accent); color: #000; font-weight: 600; font-size: 0.95rem;
      border: none; border-radius: 6px; cursor: pointer; transition: background 0.2s;
    }
    .action-btn:hover { background: var(--accent-hover); }
    .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 18px; }
    .card-header { display: flex; justify-content: space-between; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 10px; font-weight: 600; }
    .output-text { font-size: 1rem; line-height: 1.6; white-space: pre-wrap; word-break: break-word; min-height: 50px; }
    .copy-btn { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }
    .copy-btn:hover { color: #fff; border-color: var(--accent); }
    .meta { font-size: 0.8rem; color: var(--muted); margin-top: 10px; }
  </style>
</head>
<body>

<div class="container">
  <div>
    <h1>Grammar & Paraphrase Engine</h1>
    <p class="subtitle">Neural NLP context solver. Zero content refusal.</p>
  </div>

  <textarea id="inputText" placeholder="Enter text to analyze..."></textarea>
  
  <div class="controls">
    <div class="mode-group">
      <button class="mode-btn active" onclick="setMode('grammar', this)">Fix Grammar</button>
      <button class="mode-btn" onclick="setMode('paraphrase', this)">Paraphrase</button>
    </div>
    <button id="submitBtn" class="action-btn" onclick="execute()">Process Text</button>
  </div>

  <div class="card">
    <div class="card-header">
      <span>Processed Output</span>
      <button class="copy-btn" onclick="copyOutput()">Copy Text</button>
    </div>
    <div id="outputText" class="output-text">Your result will appear here.</div>
    <div id="statusMeta" class="meta"></div>
  </div>
</div>

<script>
  const BACKEND_URL = "https://grammar-backend-yd89.onrender.com";
  let activeMode = "grammar";

  function setMode(mode, btn) {
    activeMode = mode;
    document.querySelectorAll(".mode-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
  }

  async function execute() {
    const inputEl = document.getElementById("inputText");
    const outputEl = document.getElementById("outputText");
    const metaEl = document.getElementById("statusMeta");
    const btn = document.getElementById("submitBtn");

    const text = inputEl.value.trim();
    if (!text) return;

    btn.disabled = true;
    outputEl.innerText = "Processing through neural pipeline...";
    metaEl.innerText = "";

    try {
      const response = await fetch(`${BACKEND_URL}/process`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: text, mode: activeMode })
      });

      const data = await response.json();
      if (!response.ok) throw new Error(data.detail || "Processing failed");

      outputEl.innerText = data.corrected;
      metaEl.innerText = `Mode: ${data.mode.toUpperCase()} | Session ID: ${data.session_id}`;
    } catch (err) {
      outputEl.innerText = "Notice: " + err.message;
    } finally {
      btn.disabled = false;
    }
  }

  function copyOutput() {
    const text = document.getElementById("outputText").innerText;
    if (text && !text.startsWith("Your result") && !text.startsWith("Notice:")) {
      navigator.clipboard.writeText(text);
    }
  }
</script>

</body>
</html>
